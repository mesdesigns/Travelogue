<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#efebe5">
<meta name="description" content="Plan trips, stamp what you do, and keep each trip as a little booklet.">
<title>Travel Log</title>
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<div class="app" id="app">
  <header class="appbar">
    <button class="backpill" id="barTrips" type="button" data-home hidden aria-label="All trips"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg><span>Trips</span></button>
    <div class="appbar-titles"><span class="eyebrow" id="eyebrow">Travel log</span><h1 id="title">Trips</h1><span class="sync" id="status" aria-live="polite"></span></div>
    <button class="round" id="barUndo" type="button" aria-label="Undo" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="round" id="barSettings" type="button" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg></button>
  </header>
  <main class="stage" id="stage" aria-labelledby="title">
    <section class="screen" id="s-home"><p class="loading" role="status">Loading your trips…</p></section>
    <section class="screen" id="s-today" role="tabpanel" aria-labelledby="tab-today" hidden></section>
    <section class="screen" id="s-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
    <section class="screen" id="s-journal" role="tabpanel" aria-labelledby="tab-journal" hidden></section>
  </main>
  <div class="booklet" id="booklet" hidden role="dialog" aria-modal="true" aria-label="Travel booklet"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <nav aria-label="Trip sections"><div class="tabbar away" id="tabbar" role="tablist" aria-label="Trip sections">
    <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
    <button type="button" role="tab" id="tab-today" aria-controls="s-today" data-tab="today" aria-selected="false" tabindex="-1"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></span>Today</button>
    <button type="button" role="tab" id="tab-plan" aria-controls="s-plan" data-tab="plan" aria-selected="false" tabindex="-1"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.5v4M16 2.5v4"/></svg></span>Plan</button>
    <button type="button" role="tab" id="tab-journal" aria-controls="s-journal" data-tab="journal" aria-selected="false" tabindex="-1"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3M9 7.5h6M9 11h4"/></svg></span>Journal</button>
  </div></nav>
</div>
<dialog class="layer" id="sheet" aria-labelledby="sheetTitle"><div class="panel" id="panel"></div></dialog>
<script>
(() => {
/*JS*/
})();
</script>
</body>
</html>
